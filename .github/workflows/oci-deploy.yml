name: OCI deploy (platform)

# 기존 배포 워크플로(GCP · 팀원 서버)는 그대로 두고, 그 빌드가 끝난 뒤 이어서 돈다.
#  1. 기존 빌드가 올린 amd64 이미지(:dev · :stg · :prod)에 arm64 이미지를 더해 같은 태그를 멀티 아키텍처로 다시 만든다.
#     → GCP(amd64)와 OCI(arm64)가 같은 태그를 쓴다. 커밋 고정 태그 :sha-<commit> 도 함께 붙인다.
#  2. OCI VM 의 self-hosted runner 가 :sha-<commit> 으로 app 만 교체한다 (deploy/oci/deploy.sh).
# 수동 실행(workflow_dispatch)은 이미 올라간 :sha-<commit> 을 다시 배포한다 — 롤백 · 첫 배포용.
on:
  workflow_run:
    workflows:
      - Deploy to dev (this machine)
      - Deploy to stg (this machine)
      - Deploy to prod (GCP VM via IAP)
    types: [completed]
  workflow_dispatch:
    inputs:
      env:
        description: 배포 환경
        type: choice
        options: [dev, stg, prod]
        required: true
      sha:
        description: 배포할 커밋 (ghcr.io/pfplay/pfplay-api:sha-<commit> 이 있어야 함)
        required: true

env:
  IMAGE: ghcr.io/pfplay/pfplay-api

# workflow_run 은 기본 브랜치(main)에 있는 이 파일로 실행된다 — dev · stg 트리거도 main 머지 후부터 동작.
concurrency:
  group: >-
    oci-deploy-${{ inputs.env || (contains(github.event.workflow_run.name, 'prod') && 'prod')
    || (contains(github.event.workflow_run.name, 'stg') && 'stg') || 'dev' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      env: ${{ steps.r.outputs.env }}
      sha: ${{ steps.r.outputs.sha }}
      build: ${{ steps.r.outputs.build }}
      runner: ${{ steps.r.outputs.runner }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_ENV: ${{ inputs.env }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            env="$IN_ENV"; sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$IN_SHA" --jq .sha); build=false
          else
            case "$RUN_NAME" in
              "Deploy to dev (this machine)") env=dev ;;
              "Deploy to stg (this machine)") env=stg ;;
              "Deploy to prod (GCP VM via IAP)") env=prod ;;
            esac
            sha="$RUN_SHA"
            # 배포 단계 실패(GCP · 팀원 서버 사정)와 무관하게, 기존 빌드 job 이 성공했을 때만 이어간다.
            built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name == "Build & push image") | .conclusion] | first')
            [ "$built" = success ] && build=true || build=skip
          fi
          [ "$env" = prod ] && runner=oci-prod || runner=oci-dev
          echo "env=$env sha=$sha build=$build runner=$runner"
          { echo "env=$env"; echo "sha=$sha"; echo "build=$build"; echo "runner=$runner"; } >> "$GITHUB_OUTPUT"

  build-arm64:
    name: Build arm64 image
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build jar
        run: chmod +x ./gradlew && ./gradlew :app:bootJar -x test

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=oci-arm64
          cache-to: type=gha,scope=oci-arm64,mode=max

  manifest:
    name: Merge amd64 + arm64 under one tag
    needs: [resolve, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        env:
          TAG: ${{ needs.resolve.outputs.env }}
          SHA: ${{ needs.resolve.outputs.sha }}
          ARM64: ${{ needs.build-arm64.outputs.digest }}
        run: |
          # 기존 빌드가 방금 올린 :$TAG 에서 amd64 이미지 digest 를 꺼낸다 (단일 매니페스트 · 인덱스 모두 처리).
          raw=$(docker buildx imagetools inspect --raw "$IMAGE:$TAG")
          if echo "$raw" | jq -e '.manifests' >/dev/null; then
            amd64=$(echo "$raw" | jq -r '[.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux")] | first | .digest')
          else
            amd64="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          fi
          if [ -z "$amd64" ] || [ "$amd64" = null ]; then echo "no amd64 image under $IMAGE:$TAG" >&2; exit 1; fi
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:sha-$SHA" "$IMAGE@$amd64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:sha-$SHA"

  deploy:
    name: Deploy to OCI (${{ needs.resolve.outputs.env }})
    needs: [resolve, manifest]
    # 수동 실행은 build · manifest 를 건너뛰므로, 앞 job 이 skipped 여도 진행한다.
    if: >-
      always() && needs.resolve.result == 'success' && needs.resolve.outputs.build != 'skip' &&
      (needs.manifest.result == 'success' || needs.resolve.outputs.build == 'false')
    runs-on: [self-hosted, '${{ needs.resolve.outputs.runner }}']
    environment: oci-${{ needs.resolve.outputs.env }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: deploy/oci

      - name: Sync deploy files and .env
        env:
          ENV: ${{ needs.resolve.outputs.env }}
          # 기존 워크플로가 쓰는 저장소 시크릿 DOT_ENV 와 구분되는 Environment 시크릿.
          DOT_ENV: ${{ secrets.OCI_DOT_ENV }}
        run: |
          dir="/opt/pfplay/$ENV"
          mkdir -p "$dir"
          install -m 0644 deploy/oci/compose.yml "$dir/compose.yml"
          install -m 0755 deploy/oci/deploy.sh "$dir/deploy.sh"
          umask 077 && printf '%s\n' "$DOT_ENV" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > "$dir/.env"

      # 기존 배포와 같은 PACKAGE_ACCESS_TOKEN 으로 로그인 — pfplay-api 와 다른 저장소의 pfplay-streaming 이미지를 모두 받는다.
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.PACKAGE_ACCESS_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Replace app
        run: /opt/pfplay/${{ needs.resolve.outputs.env }}/deploy.sh ${{ needs.resolve.outputs.env }} app sha-${{ needs.resolve.outputs.sha }}

      - name: Logout
        if: always()
        run: docker logout ghcr.io
