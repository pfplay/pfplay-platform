name: CI Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      # 통합 테스트 게이트: Testcontainers(Docker) 로 실 Flyway 스키마 부팅 + validate.
      # ubuntu-latest 는 Docker 지원 → Testcontainers 동작. 직렬 실행(공유 스키마 truncate
      # 상호파괴 방지) 은 build.gradle 의 maxParallelForks=1 로 강제됨.
      - name: Run integration tests
        run: ./gradlew :app:integrationTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/test/*.xml
            **/build/test-results/integrationTest/*.xml
          retention-days: 14
