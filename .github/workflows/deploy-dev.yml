name: Deploy to dev (this machine)

# develop 브랜치로의 PR이 merge되면 트리거.
on:
  pull_request:
    types: [closed]
    branches: [develop]
    # 문서만 바뀐 머지는 배포하지 않는다 (#374).
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  IMAGE: ghcr.io/pfplay/pfplay-api
  TAG: dev
  TARGET_DIR: /home/eisen/PFPlay/pfplay-platform

jobs:
  build:
    if: github.event.pull_request.merged == true
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build jar
        run: chmod +x ./gradlew && ./gradlew :app:bootJar -x test

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    name: Pull & restart on this machine
    runs-on: [self-hosted, pfplay-host]
    steps:
      - name: Sync working tree to develop
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          git fetch origin develop
          git reset --hard origin/develop

      - name: Run deploy script
        working-directory: ${{ env.TARGET_DIR }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.PACKAGE_ACCESS_TOKEN }}
        run: ./scripts/deploy.sh dev
