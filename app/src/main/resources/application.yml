spring:
  profiles:
    active: local # default
    group:
      local:
        - common
      dev:
        - common
      staging:
        - common
      prod:
        - common

---
# 🟢 공통 설정
spring:
  config:
    activate:
      on-profile: common

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pfplay?characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:pfplay}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    encoding: UTF-8
    clean-disabled: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 8MB

server:
  tomcat:
    relaxed-query-chars: '[,],|,{,},^,`,<,>'
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

springdoc:
  version: 'v1'
  swagger-ui:
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: false
    path: /spec/api
  show-actuator: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    # 비즈니스 critical-path 명시 INFO 고정 — Spring Boot 기본 변경에 영향받지 않게.
    # profile별 logging.level 은 key 단위 merge 라 prod/staging 에도 상속된다.
    com.pfplaybackend.api.party: INFO
    com.pfplaybackend.api.administration: INFO
    com.pfplaybackend.api.playlist: INFO
    com.pfplaybackend.realtime: INFO

service-api:
  pytube:
    uri: ${PYTUBE_URI:http://localhost:9000}
    api-key: ${PYTUBE_API_KEY:pfplay_streaming}
    api-secret: ${PYTUBE_API_SECRET}

vercel:
  edge-config:
    id: ${VERCEL_EDGE_CONFIG_ID:}
    api-token: ${VERCEL_API_TOKEN:}
    team-id: ${VERCEL_TEAM_ID:}
    base-url: https://api.vercel.com
    maintenance-key: ${VERCEL_EDGE_CONFIG_KEY:maintenance}

# 🔐 커스텀 앱 설정
app:
  oauth2:
    providers:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
        redirect-uri: ${GOOGLE_REDIRECT_URI:https://localhost:3000/auth/callback/google}
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
        scopes:
          - email
        access-type: offline    # Google 전용: refresh token 받기
        prompt: consent         # Google 전용: 매번 동의 화면

      twitter:
        client-id: ${TWITTER_CLIENT_ID}
        client-secret: ${TWITTER_CLIENT_SECRET}
        redirect-uri: ${TWITTER_REDIRECT_URI:http://localhost:3000/auth/callback/twitter}
        authorization-uri: https://twitter.com/i/oauth2/authorize
        token-uri: https://api.twitter.com/2/oauth2/token
        user-info-uri: https://api.twitter.com/2/users/me
        scopes:
          - users.read
          - tweet.read

  jwt:
    secret: ${JWT_SECRET}
    admin-access-token-expiration-ms: 900000      # 15 min
    shared-session-token-expiration-ms: 86400000  # 24h

    cookie:
      admin:
        name: AdminAccessToken
        domain: ${ADMIN_COOKIE_DOMAIN:localhost}
        path: /
        secure: true
        same-site: Strict
        max-age-seconds: 900
        renewal-threshold-seconds: 300
      shared:
        name: SharedSessionToken
        domain: ${COOKIE_DOMAIN:localhost}
        path: /
        secure: true
        same-site: None
        max-age-seconds: 86400

  ratelimit:
    admin-login:
      ip:
        capacity: 10
        window-seconds: 300
      email:
        capacity: 5
        window-seconds: 900

  security:
    admin-origin-guard:
      enabled: true
      allowed:
        - https://localhost:3000
        - http://localhost:3000
    admin-csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
      cookie-domain: ${ADMIN_COOKIE_DOMAIN:localhost}
      same-site: Strict
      secure: true

  webclient:
    timeout:
      connection: 5000
      read: 5000
      write: 5000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  # 아바타 카탈로그 GCS 업로드 (PR 11). 키 경로 미지정 시 ApplicationDefaultCredentials 사용.
  avatar:
    storage:
      bucket: ${PFPLAY_AVATAR_BUCKET:pfplay-firebase.appspot.com}
      service-account-path: ${PFPLAY_AVATAR_GCS_KEY_PATH:}
      base-url-prefix: https://storage.googleapis.com
      max-file-size-bytes: 2097152   # 2 MiB

---

# 🟡 개발 환경
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_enum_jdbc_type: VARCHAR

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    encoding: UTF-8
    clean-disabled: true
    out-of-order: false

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.reactive.function.client: INFO

server:
  error:
    include-stacktrace: never

app:
  jwt:
    cookie:
      admin:
        domain: ${ADMIN_COOKIE_DOMAIN}
        secure: ${COOKIE_SECURE:true}
        same-site: Strict
      shared:
        domain: ${COOKIE_DOMAIN}
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:Lax}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

---

# 🟠 검증 환경
spring:
  config:
    activate:
      on-profile: staging

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_enum_jdbc_type: VARCHAR

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    encoding: UTF-8
    clean-disabled: true
    out-of-order: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.reactive.function.client: INFO
    p6spy: WARN   # SQL 로그 누출 차단 (개발 편의는 local/dev 기본 INFO 유지)

app:
  jwt:
    cookie:
      admin:
        domain: ${ADMIN_COOKIE_DOMAIN}
        secure: true
        same-site: Strict
      shared:
        domain: ${COOKIE_DOMAIN}
        secure: true
        same-site: Lax

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  security:
    admin-origin-guard:
      allowed:
        - https://stg-admin.pfplay.xyz

---

# 🔴 운영 환경
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_enum_jdbc_type: VARCHAR

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    encoding: UTF-8
    clean-disabled: true
    out-of-order: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    org.springframework.security: WARN
    org.springframework.web.reactive.function.client: WARN
    p6spy: WARN   # prod SQL 로그 누출 차단

app:
  jwt:
    cookie:
      admin:
        domain: ${ADMIN_COOKIE_DOMAIN}
        secure: true
        same-site: Strict
      shared:
        domain: ${COOKIE_DOMAIN}
        secure: true
        same-site: Lax

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  security:
    admin-origin-guard:
      allowed:
        - https://admin.pfplay.xyz

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

---
# 🔵 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: local

app:
  jwt:
    cookie:
      admin:
        secure: false
        same-site: Lax       # Strict would block cross-tab navigation from devtools
      shared:
        secure: false
        same-site: Lax
  security:
    admin-csrf:
      secure: false
      same-site: Lax
