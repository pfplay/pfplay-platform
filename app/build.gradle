plugins {
	id 'org.springframework.boot'
}

def queryDslVersion = '5.0.0'

dependencies {
	implementation project(':common')
	implementation project(':user')
	implementation project(':avatar')
	implementation project(':playlist')
	implementation project(':realtime')

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// Core Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.assertj:assertj-core:3.24.2'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:mysql:1.19.6'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.6'

	// OAuth2 + JWT
	implementation 'com.auth0:java-jwt:4.4.0'

	// QueryDSL
	implementation "com.querydsl:querydsl-core:${queryDslVersion}"
	implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
	annotationProcessor(
			"com.querydsl:querydsl-apt:${queryDslVersion}:jakarta",
			"jakarta.persistence:jakarta.persistence-api:3.1.0"
	)

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

	// Swagger (SpringDoc OpenAPI 3)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

	// Configuration processor
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// P6Spy
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

	// JWT - JJWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Rate limiting (admin login)
	implementation 'com.bucket4j:bucket4j-core:8.10.1'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	// TSID (Snowflake ID generation)
	implementation 'io.hypersistence:hypersistence-tsid:2.1.3'
}

// Aggregated JaCoCo report across all modules
tasks.register('jacocoAggregatedReport', JacocoReport) {
	def modules = rootProject.subprojects

	dependsOn modules.collect { it.tasks.named('test') }

	additionalSourceDirs.from(modules.collect { it.sourceSets.main.allJava.srcDirs })
	additionalClassDirs.from(modules.collect { it.sourceSets.main.output })
	executionData.from(modules.collect { module ->
		module.layout.buildDirectory.file('jacoco/test.exec')
	})

	reports {
		html.required = true
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregated/html')
		xml.required = true
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregated/jacoco.xml')
	}
}
