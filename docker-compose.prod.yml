# 운영계 (production) — 호스트 노출 포트: app 8080
# 실행: docker compose -f docker-compose.prod.yml -p pfplay-prod --env-file .env.prod up -d
#
# 사전 준비 (VM에서 1회):
#   1. 같은 부모 디렉토리에 pfplay-streaming 리포 clone (pytube build context용)
#   2. .env.prod 파일 준비 (CI가 .env.prod.example 참고해 DOT_ENV secret에서 생성)
#
# 참고:
#   - CI는 이 파일을 매 배포마다 SCP로 VM에 동기화하므로 VM에서 수동 편집 금지
#   - pytube는 pfplay-streaming 리포를 clone한 디렉토리에서 docker build 후 이미지로 사용
services:
  mysql:
    image: mysql:8.0.30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: pfplay
      MYSQL_USER: ${DB_USERNAME:-pfplay}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pytube:
    build:
      context: ../pfplay-streaming
    environment:
      API_KEY: ${PYTUBE_API_KEY:-pfplay_streaming}
      API_SECRET: ${PYTUBE_API_SECRET}
    restart: unless-stopped

  app:
    image: ghcr.io/pfplay/pfplay-api:prod
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pfplay?characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTUBE_URI: http://pytube:9000
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
